<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
  <meta name="theme-color" content="#0f172a">
  <title>BlackSurvey • ArcGIS Admin Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/dark/main.css" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --menu-width:280px;
      --bg-primary:#0f172a;
      --bg-secondary:#1e293b;
      --bg-card:#1e293b;
      --border-color:#334155;
      --text-primary:#f8fafc;
      --text-secondary:#cbd5e1;
      --text-muted:#94a3b8;
      --shadow:0 10px 25px rgba(0,0,0,0.3);
      --accent:#3b82f6;
      --success:#10b981;
      --warning:#f59e0b;
      --danger:#ef4444;
    }
    html,body{height:100%;width:100%;background:var(--bg-primary);font-family:'Inter',system-ui,-apple-system,sans-serif;overflow:hidden;font-size:16px;color:var(--text-primary);}
    .custom-scroll::-webkit-scrollbar{width:6px;height:6px}
    .custom-scroll::-webkit-scrollbar-track{background:var(--bg-secondary);border-radius:8px}
    .custom-scroll::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:8px}
    .admin-layout{display:flex;height:100vh;width:100%;overflow:hidden;}
    .sidebar{width:280px;background:var(--bg-secondary);border-right:1px solid var(--border-color);display:flex;flex-direction:column;flex-shrink:0;z-index:20;transition:transform 0.3s ease;}
    .main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-primary);}
    .nav-item{display:flex;align-items:center;gap:14px;padding:12px 20px;margin:2px 12px;border-radius:12px;color:var(--text-secondary);font-weight:500;font-size:0.9rem;transition:all 0.2s;cursor:pointer;}
    .nav-item svg{width:20px;height:20px;flex-shrink:0;}
    .nav-item:hover{background:#334155;color:#fff;}
    .nav-item.active{background:var(--accent);color:#fff;box-shadow:0 8px 16px rgba(59,130,246,0.3);}
    .stat-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:transform 0.2s;}
    .stat-card:hover{transform:translateY(-2px);}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;}
    .modal-content{background:var(--bg-card);border:1px solid var(--border-color);border-radius:20px;padding:2rem;max-width:900px;width:100%;max-height:85vh;overflow-y:auto;color:var(--text-primary);}
    .field-input{background:#0f172a;border:1px solid var(--border-color);border-radius:12px;padding:12px 16px;font-size:0.9rem;color:white;width:100%;transition:border 0.2s;}
    .field-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,0.2);}
    .map-container{border-radius:16px;overflow:hidden;border:1px solid var(--border-color);}
    .badge{padding:4px 12px;border-radius:9999px;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
    .pulse-dot{width:8px;height:8px;border-radius:50%;display:inline-block;position:relative;}
    .pulse-dot::after{content:'';position:absolute;width:100%;height:100%;border-radius:50%;background:inherit;opacity:0.5;animation:pulse 2s infinite;}
    @keyframes pulse{0%{transform:scale(1);opacity:0.5}100%{transform:scale(3);opacity:0}}
    @media (max-width: 1024px) {.sidebar{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%);z-index:50;}.sidebar.mobile-open{transform:translateX(0);}}
  </style>
</head>

      { name:"Lagos Island Fiber", progress:78, status:"Active", lead:"L. Bello", points:340, type:"Fiber Optic", startDate:"2026-06-01", priority:"High", layerURL:"fiber_network_4326", featureCount:2340 },

      { name:"Kano Tower Upgrade", progress:15, status:"On Hold", lead:"F. Nkosi", points:67, type:"Telecom Tower", startDate:"2026-06-20", priority:"Low", layerURL:"towers_4326", featureCount:45 }
    ];

    // Survey templates (like Survey123)
    const surveyTemplates = [
      { id:"S001", name:"Infrastructure Damage Assessment", category:"Emergency", questions:12, submissions:234, lastModified:"2026-07-19", status:"Published" },
      { id:"S002", name:"Telecom Tower Inspection", category:"Telecom", questions:18, submissions:567, lastModified:"2026-07-18", status:"Published" },
      { id:"S003", name:"Water Point Mapping", category:"WASH", questions:8, submissions:123, lastModified:"2026-07-15", status:"Draft" },
      { id:"S004", name:"Road Condition Survey", category:"Transportation", questions:15, submissions:89, lastModified:"2026-07-20", status:"Published" }
    ];

    // Feature layers
    const featureLayers = [
      { name:"Fiber Optic Cables", type:"Line", features:2340, lastUpdated:"2 hours ago", status:"Active", geometryType:"esriGeometryPolyline" },
      { name:"Telecom Towers", type:"Point", features:45, lastUpdated:"1 hour ago", status:"Active", geometryType:"esriGeometryPoint" },
      { name:"Power Substations", type:"Polygon", features:128, lastUpdated:"30 min ago", status:"Active", geometryType:"esriGeometryPolygon" },
      { name:"Survey Plots", type:"Polygon", features:892, lastUpdated:"5 min ago", status:"Active", geometryType:"esriGeometryPolygon" }
    ];

    const $ = id => document.getElementById(id);
    const container = document.getElementById('viewContainer');
    const viewTitle = document.getElementById('viewTitle');
    const sidebar = document.getElementById('sidebar');
    const globalModal = document.getElementById('globalModal');
    const modalContent = document.getElementById('modalContent');

    function openModal(html) { modalContent.innerHTML = html; globalModal.style.display = 'flex'; }
    function closeModal() { globalModal.style.display = 'none'; }
    globalModal.addEventListener('click', e => { if (e.target === globalModal) closeModal(); });

    function setActiveNav(view) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`.nav-item[data-view="${view}"]`)?.classList.add('active');
    }

    // ----- ICON SVGS -----
    const icons = {
      agents: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>',
      collection: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>',
      pending: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
      projects: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>',

      table: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>',
      map: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>',
      location: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>',
      survey: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>',
      layer: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>',
    };

    // ----- ARCGIS MAP INITIALIZATION -----
    let mapView = null;

    async function initArcGISMap(containerId, center = [9.0820, 8.6753], zoom = 6) {
      try {
        require(["esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer", "esri/Graphic", "esri/geometry/Point"], 
        (Map, MapView, FeatureLayer, Graphic, Point) => {
          const map = new Map({
            basemap: "dark-gray-vector" // ArcGIS dark basemap
          });

          const view = new MapView({
            container: containerId,
            map: map,
            center: center,
            zoom: zoom,
            ui: {
              components: ["zoom", "compass", "attribution"]
            }
          });

          // Add agent locations as graphics
          view.when(() => {
            agents.forEach(agent => {
              if (agent.lat && agent.lng) {
                const point = new Point({
                  longitude: agent.lng,
                  latitude: agent.lat
                });

                const markerSymbol = {
                  type: "simple-marker",
                  color: agent.status === 'Active' ? [16, 185, 129] : [245, 158, 11],
                  size: "12px",
                  outline: {
                    color: [255, 255, 255],
                    width: 2
                  }
                };

                const graphic = new Graphic({
                  geometry: point,
                  symbol: markerSymbol,
                  attributes: agent,
                  popupTemplate: {
                    title: agent.name,
                    content: `
                      <b>Region:</b> ${agent.region}<br>
                      <b>Status:</b> ${agent.status}<br>
                      <b>Collected Today:</b> ${agent.collectedToday} points<br>
                      <b>Last Sync:</b> ${agent.lastSync}<br>
                      <b>Device:</b> ${agent.device}<br>
                      <b>GPS Accuracy:</b> ${agent.accuracy}
                    `
                  }
                });

                view.graphics.add(graphic);
              }
            });

            // Add project sites
            const projectSites = [
              {name:"Lagos Fiber Project", lat:6.5244, lng:3.3792, type:"Fiber"},
              {name:"Abuja Data Center", lat:9.0579, lng:7.4951, type:"Data Center"},
              {name:"Kano Tower Site", lat:11.9998, lng:8.5265, type:"Telecom"}
            ];

            projectSites.forEach(site => {
              const point = new Point({
                longitude: site.lng,
                latitude: site.lat
              });

              const symbol = {
                type: "simple-marker",
                color: [59, 130, 246],
                size: "16px",
                outline: {
                  color: [255, 255, 255],
                  width: 2
                }
              };

              const graphic = new Graphic({
                geometry: point,
                symbol: symbol,
                popupTemplate: {
                  title: site.name,
                  content: `<b>Type:</b> ${site.type}<br><b>Status:</b> Active Project`
                }
              });

              view.graphics.add(graphic);
            });
          });

          mapView = view;
        });
      } catch (error) {
        console.error("ArcGIS initialization error:", error);
        // Fallback to Leaflet if ArcGIS fails
        initLeafletFallback(containerId, center, zoom);
      }
    }

    function initLeafletFallback(containerId, center, zoom) {
      const mapEl = document.getElementById(containerId);
      if (!mapEl) return;
      
      const map = L.map(containerId, { center: center, zoom: zoom });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap, &copy; CartoDB'
      }).addTo(map);

      agents.forEach(a => {
        if (a.lat) {
          const color = a.status === 'Active' ? '#10b981' : '#f59e0b';
          L.circleMarker([a.lat, a.lng], {
            radius: 8,
            color: '#fff',
            fillColor: color,
            fillOpacity: 0.9,
            weight: 2
          }).bindPopup(`<b>${a.name}</b><br>${a.region}<br>${a.status}`).addTo(map);
        }
      });
    }

    // ----- NAVIGATION -----
    function switchView(view) {
      setActiveNav(view);
      const views = {
        'overview': renderOverview,
        'agents': renderAgents,
        'surveys': renderSurveys,
        'projects': renderProjects,
        'layers': renderLayers,
        'sync': renderSync,
        'mapview': renderMapView
      };
      
      if (views[view]) {
        views[view]();
      }
      
      sidebar.classList.remove('mobile-open');
    }

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => switchView(item.dataset.view));
    });
    
    document.getElementById('menuToggle').addEventListener('click', () => {
      sidebar.classList.toggle('mobile-open');
    });
    
    setInterval(() => {
      document.getElementById('liveTime').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
    }, 1000);
    
    // Initialize with overview
    switchView('overview');
  })();
